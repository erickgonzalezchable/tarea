{% extends 'base.html' %}{% block body %}<section class="card narrow"><h1>Registro de donante</h1><form method="post"><label>Usuario<input name="usuario" required minlength="3" autocomplete="username"></label><label>Nombre o negocio<input name="nombre" required></label><label>Teléfono (10 dígitos)<input name="telefono" inputmode="numeric" pattern="[0-9]{10}" maxlength="10"></label><label>Contraseña (mínimo 6)<input type="password" name="password" minlength="6" required autocomplete="new-password"></label><button>Crear cuenta</button></form><p class="muted"><a href="{{url_for('login')}}">Ya tengo cuenta</a></p></section>{% endblock %}
