<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mesa Compartida</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><header><a href="{{url_for('panel') if me else url_for('login')}}">🍽 Mesa Compartida</a>{% if me %}<nav>{{me.nombre}} · {{me.rol}} <a href="{{url_for('password')}}">Contraseña</a><form method="post" action="{{url_for('logout')}}"><button class="link">Salir</button></form></nav>{% endif %}</header><main>{% for cat,msg in get_flashed_messages(with_categories=true) %}<p class="flash {{cat}}">{{msg}}</p>{% endfor %}{% block body %}{% endblock %}</main><footer>TecNM · Campus Tuxtla Gutiérrez · Mesa Compartida</footer></body></html>
