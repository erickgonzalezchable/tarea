{% extends 'base.html' %}{% block body %}<section class="card narrow"><h1>Registrar donación</h1><form method="post">{% if me.rol=='ADMIN' %}<label>Donante<select name="donante_id" required>{% for d in donors %}<option value="{{d.id}}">{{d.nombre}}</option>{% endfor %}</select></label>{% endif %}<label>Alimento<select name="alimento">{% for f in foods %}<option>{{f}}</option>{% endfor %}</select></label><label>Peso (kg)<input name="kg" type="number" min="0.1" max="150" step="0.1" required></label><label>Horas disponibles<select name="horas">{% for h in [2,4,8,12,24,48] %}<option>{{h}}</option>{% endfor %}</select></label><label>Zona<select name="zona">{% for z in zones %}<option>{{z.nombre}}</option>{% endfor %}</select></label><label>Dirección del Punto A<input name="direccion" required minlength="5"></label><label>Comedor Punto B<select name="comedor">{% for c in dining %}<option>{{c.nombre}}</option>{% endfor %}</select></label><label>Observaciones<textarea name="observaciones"></textarea></label><button>Guardar</button></form></section>{% endblock %}
