{% extends 'base.html' %}{% block body %}<section class="card narrow"><h1>Alta de voluntario</h1><form method="post">{% for name,label in [('usuario','Usuario'),('nombre','Nombre'),('telefono','Teléfono'),('password','Contraseña'),('vehiculo','Vehículo'),('placas','Placas')] %}<label>{{label}}<input name="{{name}}" {% if name!='telefono' %}required{% endif %} {% if name=='password' %}type="password" minlength="6"{% endif %}></label>{% endfor %}<label>Capacidad<select name="capacidad"><option>50</option><option>150</option></select></label><label><input type="checkbox" name="refrigerado"> Refrigeración</label><button>Registrar</button></form></section>{% endblock %}
